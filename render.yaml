services:
  - type: web
    name: career-agent
    runtime: python
    buildCommand: pip install -r agent/requirements.txt
    startCommand: python agent/server.py
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: PORT
        value: 10000
